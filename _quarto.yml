project:
  type: website
  output-dir: _site
  execute-dir: project

website:
  title: "Seoul Bike Demand Forecasting"
  repo-url: "https://github.com/MPalma21/seoul-bike-demand-forecasting"
  repo-actions: [source, issue]
  favicon: assets/favicon.svg
  navbar:
    background: dark
    title: "Seoul Mobility Lab"
    left:
      - href: index.qmd
        text: Case study
      - href: es/index.qmd
        text: Español
      - href: docs/methodology.md
        text: Methodology
      - href: docs/model-card.md
        text: Model card
    right:
      - icon: github
        href: https://github.com/MPalma21/seoul-bike-demand-forecasting
  page-footer:
    left: "Seoul Bike Demand Forecasting"
    right: "Miguelangel Palma Rojas · Reproducible ML"

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    css: assets/styles.css
    toc: true
    toc-depth: 3
    code-fold: false
    code-tools: true
    code-line-numbers: true
    code-overflow: scroll
    include-after-body: assets/code-tools-fix.html
    smooth-scroll: true
    link-external-newwindow: true

execute:
  freeze: auto
  warning: false
  message: false
